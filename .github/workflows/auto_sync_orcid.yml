name: Auto-Sync ORCID Publications & Reviews

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-orcid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch and Sync Publications & Peer Reviews from ORCID API
        run: |
          python scripts/sync_orcid.py

      - name: Commit and Push Updated Publications & Reviewer Activities
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add publications.json reviewers.json cv.html index.html assets/Hyeokjae_Kwon_CV.pdf
          git diff --quiet && git diff --staged --quiet || (git commit -m "[Auto-Sync] Update publications and peer reviewer activities from ORCID API" && git push origin main)
